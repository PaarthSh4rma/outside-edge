databases:
  - name: outside-edge-db
    databaseName: outside_edge
    user: outside_edge

services:
  - type: web
    name: outside-edge-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: outside-edge-db
          property: connectionString
      - key: ADMIN_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://outside-edge-web.onrender.com
      - key: SCORE_STALE_AFTER_MINUTES
        value: "5"
      - key: EMAIL_FROM
        value: Outside Edge <newsletter@example.com>
      - key: PUBLIC_SITE_URL
        value: https://outside-edge-web.onrender.com
      - key: EMAIL_DRY_RUN
        value: "true"
      - key: RESEND_API_KEY
        sync: false

  - type: web
    name: outside-edge-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://outside-edge-api.onrender.com

  - type: cron
    name: outside-edge-daily-yorker
    runtime: python
    rootDir: backend
    schedule: "0 20 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.jobs.publish_daily_yorker --dry-run
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: outside-edge-db
          property: connectionString
      - key: ADMIN_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://outside-edge-web.onrender.com
      - key: SCORE_STALE_AFTER_MINUTES
        value: "5"
      - key: EMAIL_FROM
        value: Outside Edge <newsletter@example.com>
      - key: PUBLIC_SITE_URL
        value: https://outside-edge-web.onrender.com
      - key: EMAIL_DRY_RUN
        value: "true"
      - key: RESEND_API_KEY
        sync: false
