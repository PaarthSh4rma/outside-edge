name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: outside_edge
          POSTGRES_PASSWORD: outside_edge
          POSTGRES_DB: outside_edge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U outside_edge -d outside_edge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://outside_edge:outside_edge@localhost:5432/outside_edge_test
      ADMIN_API_KEY: test-admin-key
      EMAIL_FROM: Outside Edge <newsletter@example.com>
      PUBLIC_SITE_URL: https://outside-edge.test
      EMAIL_DRY_RUN: "true"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest -q

      - name: Run Alembic upgrade
        run: alembic upgrade head

      - name: Run Alembic check
        run: alembic check

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
